name: deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to continue
        required: true
        type: string
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  guard:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.confirm }}" != "DEPLOY" ]; then
            echo "confirm must be DEPLOY"
            exit 1
          fi

  test:
    needs: guard
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: pip install -c constraints.txt ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q -n 2 --dist loadfile --durations=15
      - run: python -m app.evals.run
      - run: pip-audit -r constraints.txt --no-deps

  frontend:
    needs: guard
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm audit --audit-level=high
      - run: npm run build

  deploy:
    needs: [guard, test, frontend]
    if: >-
      always() && needs.guard.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    env:
      REGION: ${{ vars.GCP_REGION }}
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REPO: ${{ vars.GCP_ARTIFACT_REPO }}
      RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
      SCHEDULER_SA: ${{ vars.GCP_SCHEDULER_SA }}
      SERVICE: support-agent
      WORKER_JOB: support-agent-worker
      MIGRATE_JOB: support-agent-migrate
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPO }}/support-agent:${{ github.event.workflow_run.head_sha || github.sha }}
      APP_ENV: ${{ inputs.environment || 'production' }}
      COMMON_ENV: APP_ENV=${{ inputs.environment || 'production' }},APP_RELEASE=${{ github.event.workflow_run.head_sha || github.sha }},FRONTEND_URL=${{ vars.FRONTEND_URL }},PUBLIC_BASE_URL=${{ vars.PUBLIC_BASE_URL }},MAIL_FROM=${{ vars.MAIL_FROM }},GRIEVANCE_EMAIL=${{ vars.GRIEVANCE_EMAIL }},LLM_MODEL=${{ vars.LLM_MODEL }},LLM_PROVIDER=${{ vars.LLM_PROVIDER || 'anthropic' }}${{ vars.LLM_BASE_URL && format(',LLM_BASE_URL={0}', vars.LLM_BASE_URL) || '' }}
      APP_SECRETS: DATABASE_URL=database-url:latest,ENCRYPTION_KEY=encryption-key:latest,JWT_SECRET=jwt-secret:latest,ADMIN_JWT_SECRET=admin-jwt-secret:latest,LLM_API_KEY=llm-api-key:latest,BREVO_API_KEY=brevo-api-key:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,SENTRY_DSN=sentry-dsn:latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Build and push image
        run: |
          docker build -t "$IMAGE" backend
          docker push "$IMAGE"
      - name: Previous revision (rollback target)
        run: |
          PREV=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format 'value(status.latestReadyRevisionName)' || true)
          echo "PREV_REVISION=$PREV" >> "$GITHUB_ENV"
          echo "previous revision: ${PREV:-none}"
      - name: Migrate database
        run: |
          gcloud run jobs deploy "$MIGRATE_JOB" \
            --image "$IMAGE" --region "$REGION" --project "$PROJECT" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "MIGRATION_DATABASE_URL=migration-database-url:latest" \
            --set-env-vars "$COMMON_ENV" \
            --command alembic --args upgrade,head \
            --max-retries 0 --task-timeout 300
          gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --project "$PROJECT" --wait
      - name: Deploy API service (no traffic yet)
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" --region "$REGION" --project "$PROJECT" \
            --min-instances 0 --max-instances 5 \
            --service-account "$RUNTIME_SA" \
            --set-secrets "$APP_SECRETS" \
            --set-env-vars "$COMMON_ENV" \
            --allow-unauthenticated \
            --no-traffic --tag candidate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Smoke and API sweep on candidate revision
        working-directory: backend
        run: |
          CANDIDATE=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format=json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print([t['url'] for t in d['status']['traffic'] if t.get('tag')=='candidate'][0])")
          echo "candidate: $CANDIDATE"
          pip install -c constraints.txt .
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$CANDIDATE/health"
          SMOKE_BASE_URL="$CANDIDATE" python -m scripts.smoke
          SMOKE_BASE_URL="$CANDIDATE" python -m scripts.api_sweep
      - name: Send traffic to the new revision
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --project "$PROJECT" --to-latest
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --project "$PROJECT" --remove-tags candidate
      - name: Deploy worker job
        run: |
          gcloud run jobs deploy "$WORKER_JOB" \
            --image "$IMAGE" --region "$REGION" --project "$PROJECT" \
            --service-account "$RUNTIME_SA" \
            --set-secrets "$APP_SECRETS" \
            --set-env-vars "$COMMON_ENV" \
            --command python --args=-m,app.worker,--max-seconds,55 \
            --max-retries 0 --task-timeout 120 --parallelism 1 --tasks 1
      - name: Scheduler (worker every minute)
        run: |
          URI="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT}/jobs/${WORKER_JOB}:run"
          ARGS=(--location "$REGION" --project "$PROJECT" --schedule "* * * * *" --time-zone "Etc/UTC" \
                --uri "$URI" --http-method POST --oauth-service-account-email "$SCHEDULER_SA")
          gcloud scheduler jobs update http "${WORKER_JOB}-tick" "${ARGS[@]}" \
            || gcloud scheduler jobs create http "${WORKER_JOB}-tick" "${ARGS[@]}"
      - name: Final health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --project "$PROJECT" --format 'value(status.url)')
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL/health"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 "$URL/ready"
