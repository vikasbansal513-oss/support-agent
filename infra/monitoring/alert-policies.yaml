# Cloud Monitoring alert policies. Apply with: gcloud alpha monitoring policies create --policy-from-file=<file>
# Split into one policy per document when applying.
displayName: support-agent API 5xx rate
combiner: OR
conditions:
  - displayName: 5xx responses above 5 per 5 minutes
    conditionThreshold:
      filter: >-
        resource.type="cloud_run_revision" AND resource.labels.service_name="support-agent"
        AND metric.type="run.googleapis.com/request_count" AND metric.labels.response_code_class="5xx"
      comparison: COMPARISON_GT
      thresholdValue: 5
      duration: 300s
      aggregations:
        - alignmentPeriod: 300s
          perSeriesAligner: ALIGN_SUM
---
displayName: support-agent worker job failed
combiner: OR
conditions:
  - displayName: worker execution failed
    conditionMatchedLog:
      filter: >-
        resource.type="cloud_run_job" AND resource.labels.job_name="support-agent-worker"
        AND severity>=ERROR AND jsonPayload.msg="job failed"
---
displayName: support-agent worker silent (no heartbeat run)
combiner: OR
conditions:
  - displayName: no worker execution for 10 minutes
    conditionAbsent:
      filter: >-
        resource.type="cloud_run_job" AND resource.labels.job_name="support-agent-worker"
        AND metric.type="run.googleapis.com/job/completed_execution_count"
      duration: 600s
---
displayName: support-agent critical errors
combiner: OR
conditions:
  - displayName: any critical error log
    conditionMatchedLog:
      filter: >-
        resource.type="cloud_run_revision" AND resource.labels.service_name="support-agent"
        AND severity>=CRITICAL
